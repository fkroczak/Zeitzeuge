name: EXE bauen

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # für Releases bei Tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Starttest (Fenster öffnen und schließen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/start_test.py

      - name: 3CX-Test (nachgebaute Seite)
        # Build-Rechner haben keine Grafikkarte. Scheitert nur dieser Test,
        # wird die EXE trotzdem gebaut (Warnung statt Abbruch).
        continue-on-error: true
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python tests/pbx_test.py || python tests/pbx_test.py

      - name: Schnelltest (Fensterabfrage, Skript-Server)
        run: python tests/smoke_test.py

      - name: EXE bauen
        run: pyinstaller --noconfirm --clean ZeitZeuge.spec

      - name: EXE als Download bereitstellen
        uses: actions/upload-artifact@v6
        with:
          name: ZeitZeuge-build-${{ github.run_number }}
          path: dist/ZeitZeuge.exe
          retention-days: 30

      - name: Release anlegen (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ZeitZeuge.exe
          generate_release_notes: true
