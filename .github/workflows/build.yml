name: EXE bauen

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # für Releases bei Tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Starttest (Fenster öffnen und schließen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import sys; from PyQt5.QtCore import QTimer; from PyQt5.QtWidgets import QApplication; app = QApplication(sys.argv); import main_timeline; w = main_timeline.TimelineApp(); w.show(); QTimer.singleShot(1000, app.quit); app.exec_(); print('Start ok')"

      - name: EXE bauen
        run: pyinstaller --noconfirm --clean ZeitZeuge.spec

      - name: EXE als Download bereitstellen
        uses: actions/upload-artifact@v6
        with:
          name: ZeitZeuge-build-${{ github.run_number }}
          path: dist/ZeitZeuge.exe
          retention-days: 30

      - name: Release anlegen (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ZeitZeuge.exe
          generate_release_notes: true
