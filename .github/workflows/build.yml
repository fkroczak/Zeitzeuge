name: EXE bauen

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  # Kein pull_request: jeder Branch-Push läuft schon, die Prüfung erscheint auch im PR.
  # Sonst lief jeder Commit mit offenem PR doppelt.
  workflow_dispatch:

# Neuer Push auf denselben Branch bricht den älteren, noch laufenden Lauf ab (nicht auf main und Tags,
# dort soll jeder Stand ein Release werden).
# main und Tags bekommen je Commit eine eigene Gruppe, damit kein wartender Lauf verworfen wird.
concurrency:
  group: >-
    ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    && format('build-{0}-{1}', github.ref, github.sha) || format('build-{0}', github.ref) }}
  cancel-in-progress: true

permissions:
  contents: write  # für Releases bei Tags
  actions: write   # alte Artefakte löschen (Speicherplatz)

jobs:
  # Tests laufen parallel zum Bau, aufgeteilt auf drei Rechner: die zwei Browser-Tests
  # (3CX, M42) brauchen je knapp 3 Minuten, alles andere zusammen etwa 2,5 Minuten.
  test:
    name: Tests (${{ matrix.teil }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - teil: 3CX
            args: tests/pbx_test.py
          - teil: M42
            args: tests/m42_test.py
          - teil: Rest
            args: --ignore=tests/pbx_test.py --ignore=tests/m42_test.py
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # version_test liest die git-Geschichte

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lesbarkeit (nur Hinweis)
        if: matrix.teil == 'Rest'
        run: python tests/readability_check.py

      # Alle Tests (pytest.ini, tests/conftest.py): Logik-Tests direkt, Tests mit Oberfläche,
      # Browser (Edge) oder Prozessen je als eigener Python-Prozess. Fehler erscheinen als Annotation.
      - name: Tests (pytest)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: python -m pytest -v -rs --durations=10 ${{ matrix.args }}

  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # ganze Geschichte: version.py zählt die Merges in main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Der fertige Bootloader aus dem PyInstaller-Paket steckt auch in vielen Schadprogrammen,
      # Defender (und damit Chrome) meldet EXE-Dateien damit oft fälschlich als Virus.
      # Selbst kompiliert ist er einzigartig und fällt deutlich seltener auf.
      # Das fertig gebaute Paket wird je PyInstaller-Version zwischengespeichert (spart knapp
      # eine Minute); der Bootloader bleibt selbst kompiliert, nur nicht bei jedem Lauf neu.
      - name: Selbst kompilierten Bootloader aus dem Cache holen
        id: bootloader-cache
        uses: actions/cache@v4
        with:
          path: bootloader-wheel
          key: bootloader-${{ runner.os }}-py3.11-${{ hashFiles('requirements.txt') }}

      - name: PyInstaller-Bootloader selbst kompilieren
        if: steps.bootloader-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          $pin = (Select-String -Path requirements.txt -Pattern '^pyinstaller==').Line
          pip wheel --no-deps --no-cache-dir --no-binary pyinstaller -w bootloader-wheel $pin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: PyInstaller mit eigenem Bootloader installieren
        shell: pwsh
        run: |
          $whl = Get-ChildItem bootloader-wheel\pyinstaller-*.whl | Select-Object -First 1
          pip install --force-reinstall --no-deps $whl.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Version MAJOR.MINOR.PATCH, gezählt aus der git-Geschichte von main (siehe src/version.py),
      # z. B. 4.1.3; nicht auf main: 4.1.3-test186. Ein Tag muss genau zur Version passen.
      - name: Versionsnummer bestimmen
        id: version
        shell: pwsh
        run: |
          $v = python src/version.py
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::$v"; exit 1 }
          "ZZ_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "::notice title=Version::Zeitzeuge $v"

      - name: EXE bauen
        run: pyinstaller --noconfirm --clean ZeitZeuge.spec

      - name: EXE signieren (nur wenn ein Zertifikat hinterlegt ist)
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:SIGN_PFX_BASE64) {
            Write-Host "::notice title=Signatur::Kein Zertifikat hinterlegt (Secrets SIGN_PFX_BASE64, SIGN_PFX_PASSWORD), EXE bleibt unsigniert."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "signatur.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:SIGN_PFX_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 /d "Zeitzeuge" dist\ZeitZeuge.exe
          $code = $LASTEXITCODE
          Remove-Item $pfx -Force
          if ($code -ne 0) { exit $code }
          & $signtool.FullName verify /pa dist\ZeitZeuge.exe

      # Ordner-Variante für Rechner mit EDR (z. B. Cortex XDR auf der PAW): entpackt nichts nach %TEMP%
      - name: Ordner-Variante bauen (PAW)
        shell: pwsh
        env:
          ZEITZEUGE_ONEDIR: "1"
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          pyinstaller --noconfirm ZeitZeuge.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:SIGN_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "signatur.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1
            & $signtool.FullName sign /f $pfx /p $env:SIGN_PFX_PASSWORD /fd SHA256 `
              /tr http://timestamp.digicert.com /td SHA256 /d "Zeitzeuge" dist\ZeitZeuge-Ordner\ZeitZeuge.exe
            $code = $LASTEXITCODE
            Remove-Item $pfx -Force
            if ($code -ne 0) { exit $code }
          }
          Compress-Archive -Path dist\ZeitZeuge-Ordner\* -DestinationPath dist\ZeitZeuge-Ordner.zip -Force

      # Installationsassistent (installer/zeitzeuge.iss) aus der Ordner-Variante: installiert ohne
      # Adminrechte, aktualisiert vorhandene Installationen und ersetzt alte Einzeldateien
      - name: Installationsassistent bauen
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $nums = python -c "import sys; sys.path.insert(0, 'src'); import version; print('.'.join(map(str, version.file_version())))"
          & $iscc /Qp "/DAppVersion=$env:ZZ_VERSION" "/DFileVersion=$nums" installer\zeitzeuge.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:SIGN_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "signatur.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1
            & $signtool.FullName sign /f $pfx /p $env:SIGN_PFX_PASSWORD /fd SHA256 `
              /tr http://timestamp.digicert.com /td SHA256 /d "Zeitzeuge einrichten" dist\Zeitzeuge-Setup.exe
            $code = $LASTEXITCODE
            Remove-Item $pfx -Force
            if ($code -ne 0) { exit $code }
          }

      # Artefakte zählen zum Speicher des Kontos. Ältere als 2 Tage löschen, sonst scheitert
      # der Upload ("Artifact storage quota has been hit").
      - name: Alte Artefakte löschen (älter als 2 Tage)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $grenze = (Get-Date).ToUniversalTime().AddDays(-2)
          $alle = gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100" --paginate --jq '.artifacts[] | [.id, .created_at] | @tsv'
          foreach ($zeile in $alle) {
            $id, $am = $zeile -split "`t"
            if ([datetime]::Parse($am).ToUniversalTime() -lt $grenze) {
              gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$id" | Out-Null
            }
          }

      - name: Installationsassistent als Download bereitstellen
        # main bekommt ein Release, Artefakte nur für Branches/PRs. Ist der Speicher voll,
        # darf das den Build nicht scheitern lassen.
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: Zeitzeuge-Setup-${{ env.ZZ_VERSION }}
          path: dist/Zeitzeuge-Setup.exe
          retention-days: 5

      - name: Ordner-Variante als Download bereitstellen
        # main bekommt ein Release, Artefakte nur für Branches/PRs. Ist der Speicher voll,
        # darf das den Build nicht scheitern lassen.
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: ZeitZeuge-Ordner-${{ env.ZZ_VERSION }}
          path: dist/ZeitZeuge-Ordner.zip
          retention-days: 5

      - name: EXE als Download bereitstellen
        # main bekommt ein Release, Artefakte nur für Branches/PRs. Ist der Speicher voll,
        # darf das den Build nicht scheitern lassen.
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: ZeitZeuge-${{ env.ZZ_VERSION }}
          path: dist/ZeitZeuge.exe
          retention-days: 5

      # Release als Entwurf anlegen; veröffentlicht wird es erst im Job „release“, wenn alle Tests
      # grün sind. Release-Dateien zählen nicht zum Artefakt-Speicher (der oft voll ist).
      - name: Release-Entwurf anlegen (main oder Tag v*)
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # Entwurf aus einem früheren Versuch desselben Stands entfernen
          $alt = gh release view "v$env:ZZ_VERSION" --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null | ConvertFrom-Json
          if ($alt -and $alt.isDraft) { gh release delete "v$env:ZZ_VERSION" --repo $env:GITHUB_REPOSITORY --yes }
          gh release create "v$env:ZZ_VERSION" --repo $env:GITHUB_REPOSITORY --draft `
            --target $env:GITHUB_SHA --title "Zeitzeuge $env:ZZ_VERSION" --generate-notes `
            dist/Zeitzeuge-Setup.exe dist/ZeitZeuge.exe dist/ZeitZeuge-Ordner.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Veröffentlicht den Entwurf, wenn Bau und alle Tests grün sind; sonst wird er gelöscht.
  release:
    needs: [test, build]
    if: >-
      always() && needs.build.result == 'success' && (
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    env:
      ZZ_VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Jeder Stand von main wird ein Release v<Version> (der Tag entsteht beim Veröffentlichen).
      # Der feste Link .../releases/latest/download/ZeitZeuge.exe zeigt immer auf das neueste.
      - name: Release veröffentlichen
        shell: pwsh
        run: |
          if ("${{ needs.test.result }}" -ne "success") {
            Write-Host "::error title=Release::Tests nicht grün, Entwurf v$env:ZZ_VERSION wird gelöscht"
            gh release delete "v$env:ZZ_VERSION" --repo $env:GITHUB_REPOSITORY --yes
            exit 1
          }
          gh release edit "v$env:ZZ_VERSION" --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Nur die 10 neuesten Releases behalten; ältere samt Tag löschen.
      - name: Alte Releases löschen (10 bleiben)
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $alt = gh release list --repo $env:GITHUB_REPOSITORY --limit 1000 --exclude-drafts --json tagName,createdAt |
            ConvertFrom-Json | Sort-Object { [datetime]$_.createdAt } -Descending |
            Select-Object -Skip 10 -ExpandProperty tagName
          foreach ($tag in $alt) {
            Write-Host "Lösche Release $tag"
            gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
