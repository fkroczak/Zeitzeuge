name: EXE bauen

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # für Releases bei Tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Starttest (Fenster öffnen und schließen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/start_test.py

      - name: Bedienbarkeit (Screenreader-Namen, Kontrast, Fokus, Tastatur)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/ui_audit_test.py

      - name: VPN-Logs lesen
        run: python tests/vpn_test.py

      - name: Tagesliste zusammenfassen
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/grouping_test.py

      - name: KI-Vorschläge (nachgebaute Anthropic-API)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/ai_test.py

      - name: Infobereich und Fensteraufzeichnung ein/aus
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/tray_test.py

      - name: Logs einlesen (TeamViewer, RDM)
        run: python tests/parser_test.py

      - name: Lesbarkeit (nur Hinweis)
        run: python tests/readability_check.py

      - name: 3CX-Test (Edge gegen nachgebaute Seite)
        run: python tests/pbx_test.py

      - name: ITM-Test (Edge gegen nachgebaute Zeiterfassung)
        run: python tests/itm_test.py

      - name: Schnelltest (Fensterabfrage, Skript-Server)
        run: python tests/smoke_test.py

      - name: EXE bauen
        run: pyinstaller --noconfirm --clean ZeitZeuge.spec

      - name: EXE als Download bereitstellen
        uses: actions/upload-artifact@v6
        with:
          name: ZeitZeuge-build-${{ github.run_number }}
          path: dist/ZeitZeuge.exe
          retention-days: 30

      - name: Release anlegen (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ZeitZeuge.exe
          generate_release_notes: true
