name: EXE bauen

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # für Releases bei Tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Starttest (Fenster öffnen und schließen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/start_test.py

      - name: Bedienbarkeit (Screenreader-Namen, Kontrast, Fokus, Tastatur)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/ui_audit_test.py

      - name: VPN-Logs lesen (OpenVPN u. a.)
        run: python tests/vpn_logs_test.py

      - name: VPN-Zeiten (Sophos Connect, FortiClient)
        run: python tests/vpn_test.py

      - name: Tagesliste zusammenfassen
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/grouping_test.py

      - name: KI-Vorschläge (nachgebaute Anthropic-API)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/ai_test.py

      - name: Infobereich und Fensteraufzeichnung ein/aus
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/tray_test.py

      - name: Tätigkeiten nachtragen und Nachfragen
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/journal_test.py

      - name: Logs einlesen (TeamViewer, RDM)
        run: python tests/parser_test.py

      - name: Klassifizierung ohne KI (Regeln, Vorrang, Tempo)
        run: python tests/rules_test.py

      - name: Fenster-Filter (Black-/Whitelist, Schreibfehler)
        run: python tests/tracking_filter_test.py

      - name: Robustheit (kaputte Dateien, ohne Internet, Absturz des Lesers)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/robustness_test.py

      - name: Lesbarkeit (nur Hinweis)
        run: python tests/readability_check.py

      - name: 3CX-Test (Edge gegen nachgebaute Seite)
        run: python tests/pbx_test.py

      - name: ITM-Test (Edge gegen nachgebaute Zeiterfassung)
        run: python tests/itm_test.py

      - name: Tagesliste mit vollem PC-Verlauf schnell genug
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/list_speed_test.py

      - name: 3CX direkt abfragen (nachgebauter Server)
        run: python tests/pbx_direct_test.py

      - name: Mitschnitt der Abfragen (Schwärzen, Edge gegen nachgebaute Seite)
        run: python tests/recorder_test.py

      - name: Schnelltest (Fensterabfrage, Skript-Server)
        run: python tests/smoke_test.py

      - name: EXE bauen
        run: pyinstaller --noconfirm --clean ZeitZeuge.spec

      - name: Versionsnummer prüfen (Tag v* muss zu version.py passen)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = python -c "from version import VERSION; print(VERSION)"
          if ("v$v" -ne "${{ github.ref_name }}") { Write-Host "::error::Tag ${{ github.ref_name }} passt nicht zu version.py ($v)"; exit 1 }

      - name: EXE signieren (nur wenn ein Zertifikat hinterlegt ist)
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:SIGN_PFX_BASE64) {
            Write-Host "::notice title=Signatur::Kein Zertifikat hinterlegt (Secrets SIGN_PFX_BASE64, SIGN_PFX_PASSWORD), EXE bleibt unsigniert."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "signatur.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:SIGN_PFX_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 /d "Zeitzeuge" dist\ZeitZeuge.exe
          $code = $LASTEXITCODE
          Remove-Item $pfx -Force
          if ($code -ne 0) { exit $code }
          & $signtool.FullName verify /pa dist\ZeitZeuge.exe

      - name: EXE als Download bereitstellen
        uses: actions/upload-artifact@v6
        with:
          name: ZeitZeuge-build-${{ github.run_number }}
          path: dist/ZeitZeuge.exe
          retention-days: 30

      - name: Release anlegen (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ZeitZeuge.exe
          generate_release_notes: true
