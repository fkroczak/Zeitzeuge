[pytest]
# Einfach "pytest" im Projektordner aufrufen
testpaths = tests
python_files = *_test.py
python_functions = test_*
# Nur *_test.py sind Tests; start_bench.py, screenshots.py und readability_check.py sind Werkzeuge.
markers =
    skript: eigenständiges Testskript, läuft in einem eigenen Python-Prozess (Oberfläche, Prozesse)
    browser: braucht Edge/Chrome (wird ohne Browser übersprungen, auf CI nie)
